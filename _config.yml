# Dependencies
markdown:         kramdown
highlighter:         false

# Permalinks
permalink:        pretty

# Setup
title:            READY ROUTER ONE
tagline:          'up/connected'
description:      'My little internet corner for network notes and life bits.'
url:              https://blog.readyrouterone.com
baseurl: ""
sass:
  style: compressed
  sass_dir: _scss
title_image:      favicon.png

author:
  name:           'Laura Alonso'

paginate:         5

# Custom vars
version:          1.0.0

github:
  repo:           https://github.com/coding-laura

plugins:
  - jekyll-paginate
  - jekyll-gfm-admonitions

exclude:
  - .ruby-version
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/

feed:
  path: feed.xml